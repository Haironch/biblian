# Despliegue en Netlify (biblian-app.netlify.app).
#
# Las redirecciones y las cabeceras viven en `public/_redirects` y
# `public/_headers`; aquí solo va cómo se construye el sitio.

[build]
  # vite build + sitemap + prerenderizado de las páginas de capítulo.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # Sin VITE_DATA_SOURCE: la app usa la API (Render + Turso) a través del
  # proxy `/api/*` de public/_redirects.
