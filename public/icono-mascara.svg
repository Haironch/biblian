<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Versión "maskable": fondo a sangre y columnas dentro del círculo seguro
       (80% central), porque el sistema recorta el ícono con su propia forma. -->
  <rect width="64" height="64" fill="#3A4FD8"/>
  <rect x="18.5" y="20" width="7.5" height="24" rx="2.2" fill="#fff"/>
  <rect x="28.25" y="20" width="7.5" height="24" rx="2.2" fill="#fff" fill-opacity=".7"/>
  <rect x="38" y="20" width="7.5" height="24" rx="2.2" fill="#fff" fill-opacity=".45"/>
</svg>
